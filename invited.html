<!DOCTYPE html>
<html lang="ko">
<head>

<body class="page-Invite">
  <div class="invite-wrapper">
    <main class="invite-content">
      <!-- 상단: 전시 타이틀 -->
      <div class="invite-header">
        <p class="subtitle">You're invited!</p>
        <h1 class="title">2026 상명대학교 디자인대학<br>AR·VR미디어디자인전공<br>졸업작품전시에 당신을 초대합니다.</h1>

        </div>
        <!-- 메인 전시 사이트(index.html)로 넘어가는 링크 -->
        <a href="./index.html" class="enter-btn">온라인 졸업작품전시 보러가기</a>
      </div>
    </main>
  </div>
